# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# 允许 KSP 通过 kotlin.sourceSets 注册生成代码目录（AGP 9.x 必须）
android.disallowKotlinSourceSets=false

# JVM 内存
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Kotlin
kotlin.code.style=official

# Gradle 工具链：本工程 gradle/gradle-daemon-jvm.properties 指定 JDK 25，
# 而 Android Studio 自带的 JBR 正好就是 25。这里显式登记它，避免 Gradle
# 在本地找不到时跑去 foojay/GitHub 下载 141MB 的 JDK（会卡住十几分钟）。
# 另外登记 JAVA_HOME 的 jdk-26，供其他需要 26 的场景使用。
org.gradle.java.installations.paths=E\:\\Program Files\\Android\\Android Studio\\jbr,E\:\\Program Files\\Java\\jdk-26.0.2
org.gradle.java.installations.auto-download=false

# 抑制 AGP 未支持选项的警告
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE